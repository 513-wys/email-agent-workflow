services:
  - type: web
    name: traceinbox-demo
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_DEMO
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: MULTI_USER_MODE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
